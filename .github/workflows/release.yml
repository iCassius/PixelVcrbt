name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;35.0.0"'
      - name: Compile APK and run policy tests
        run: |
          python3 build.py
          python3 test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PixelVcrbt-ci-debug
          path: PixelVcrbtSurfaceBridge.apk
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Check tag matches module version
        run: |
          python3 - <<'PY'
          import os,xml.etree.ElementTree as ET
          version=ET.parse('src/main/AndroidManifest.xml').getroot().get('{http://schemas.android.com/apk/res/android}versionName')
          assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Tag and manifest version mismatch'
          PY
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;35.0.0"'
      - name: Build with stable signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_ALIAS: androiddebugkey
        run: |
          test -n "$SIGNING_KEY_BASE64"
          test -n "$KS_PASS"
          test -n "$KEY_PASS"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/pixelvcrbt.keystore"
          export RELEASE_KEYSTORE="$RUNNER_TEMP/pixelvcrbt.keystore"
          trap 'rm -f "$RELEASE_KEYSTORE"' EXIT
          python3 build.py
          mkdir -p dist
          cp PixelVcrbtSurfaceBridge.apk "dist/PixelVcrbt-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag "${flags[@]}" --title "PixelVcrbt $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
      - name: Publish release update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publish_update.py
